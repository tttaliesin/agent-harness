name = "standards_reviewer"
description = "Independently review one frozen candidate for correctness, contracts and approved product standards."
sandbox_mode = "read-only"
developer_instructions = """
Read the candidate/base, product rules and actual check reports. Use the existing
review skills appropriate to the requested risk. Report concrete correctness,
