[build-system]
requires = ["setuptools>=75,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "harnesskit"
version = "0.1.0"
description = "Local product verification and evidence contracts for the common Harness"
requires-python = ">=3.12"
dependencies = ["PyYAML>=6.0.2,<7", "jsonschema>=4.23,<5"]

[project.scripts]
harnesskit = "harnesskit.cli:main"
harnesskit-codex-hook = "harnesskit.native_hook:main"

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1", "build>=1.2,<2", "setuptools>=75,<83"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
