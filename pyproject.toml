[project]
name = "agent-harness-maintenance"
version = "0.2.0"
description = "Maintainer checks for the agent-harness skill repository"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["PyYAML>=6.0.2,<7", "pytest>=8.3,<10", "ruff>=0.11,<1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
